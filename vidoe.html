<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Videos</title>
<style>
    body {
        background-color: black;
        color: purple;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    h1 {
        color: purple;
        margin-bottom: 30px;
    }

    .video-container {
        display: flex;
        flex-wrap: wrap; /* Allows wrapping */
        justify-content: center;
        gap: 15px; /* Space between boxes */
    }

    .video-box {
        width: 100px;
        height: 100px;
        background-color: #2c2c2c;
        border: 2px solid purple;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: lightgray;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.2s;
    }

    .video-box:hover {
        transform: scale(1.1);
        background-color: #3d3d3d;
    }
</style>
</head>
<body>

<h1>Welcome to CS Videos!</h1>

<div class="video-container">
    <!-- Chapters 1 to 9 -->
    <div class="video-box" onclick="alert('Chapter 1 video will be added later')">Chapter 1</div>
    <div class="video-box" onclick="alert('Chapter 2 video will be added later')">Chapter 2</div>
    <div class="video-box" onclick="alert('Chapter 3 video will be added later')">Chapter 3</div>
    <div class="video-box" onclick="alert('Chapter 4 video will be added later')">Chapter 4</div>
    <div class="video-box" onclick="alert('Chapter 5 video will be added later')">Chapter 5</div>
    <div class="video-box" onclick="alert('Chapter 6 video will be added later')">Chapter 6</div>
    <div class="video-box" onclick="alert('Chapter 7 video will be added later')">Chapter 7</div>
    <div class="video-box" onclick="alert('Chapter 8 video will be added later')">Chapter 8</div>
    <div class="video-box" onclick="alert('Chapter 9 video will be added later')">Chapter 9</div>

    <!-- Revision 10 to 15 -->
    <div class="video-box" onclick="alert('Revision 10 video will be added later')">Revision 10</div>
    <div class="video-box" onclick="alert('Revision 11 video will be added later')">Revision 11</div>
    <div class="video-box" onclick="alert('Revision 12 video will be added later')">Revision 12</div>
    <div class="video-box" onclick="alert('Revision 13 video will be added later')">Revision 13</div>
    <div class="video-box" onclick="alert('Revision 14 video will be added later')">Revision 14</div>
    <div class="video-box" onclick="alert('Revision 15 video will be added later')">Revision 15</div>
</div>

</body>
</html>
