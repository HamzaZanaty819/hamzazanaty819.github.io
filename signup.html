<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign-Up</title>
<style>
    body {
        background-color: black;
        color: purple;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .signup-box {
        background-color: #2c2c2c;
        padding: 40px;
        border-radius: 10px;
        text-align: center;
        width: 350px;
        box-shadow: 2px 2px 15px rgba(0,0,0,0.5);
    }

    .signup-box h2 {
        color: purple;
        margin-bottom: 20px;
    }

    .signup-box input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
        outline: none;
    }

    .signup-box button {
        background-color: purple;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
    }

    .signup-box button:hover {
        background-color: #a64ca6;
    }

    .error {
        color: red;
        margin-top: 10px;
    }

    .success {
        color: lightgreen;
        margin-top: 10px;
    }

    .note {
        color: lightgray;
        font-size: 12px;
        margin-top: 10px;
    }

    .login-link {
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: lightblue;
        text-decoration: underline;
        cursor: pointer;
    }

    .login-link:hover {
        color: #88f;
    }
</style>
</head>
<body>

<div class="signup-box">
    <h2>Sign Up</h2>
    <input type="text" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <input type="text" id="code" placeholder="Enter your 10-character code"><br>
    <button onclick="signUp()">Create Account</button>
    <div id="signupMessage" class="error"></div>
    <p class="note">If any issues occur, contact our team</p>

    <a href="login.html" class="login-link">Already have an account? Login here</a>
</div>

<script>
    // Initialize codes in localStorage if not already present
    if (!localStorage.getItem("validCodes")) {
        localStorage.setItem("validCodes", JSON.stringify([
            "1234567895",
            "whaks678as",
            "laie2536ms"
        ]));
    }

    function signUp() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const code = document.getElementById("code").value.trim();
        const msg = document.getElementById("signupMessage");

        // Load accounts and codes from localStorage
        let accounts = JSON.parse(localStorage.getItem("accounts") || "[]");
        let validCodes = JSON.parse(localStorage.getItem("validCodes") || "[]");

        // Validate email format
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
            msg.innerText = "Enter a valid email!";
            msg.className = "error";
            return;
        }

        if (!password) {
            msg.innerText = "Enter a password!";
            msg.className = "error";
            return;
        }

        if (!/^[a-zA-Z0-9]{10}$/.test(code)) {
            msg.innerText = "Code must be exactly 10 letters or numbers!";
            msg.className = "error";
            return;
        }

        // Check if code exists and hasn’t been used
        const codeIndex = validCodes.indexOf(code);
        if (codeIndex === -1) {
            msg.innerText = "Invalid or already used code!";
            msg.className = "error";
            return;
        }

        // Check if email already exists
        if (accounts.find(acc => acc.username === email)) {
            msg.innerText = "Email already registered!";
            msg.className = "error";
            return;
        }

        // Save account to localStorage
        accounts.push({username: email, password: password});
        localStorage.setItem("accounts", JSON.stringify(accounts));

        // Remove used code permanently
        validCodes.splice(codeIndex, 1);
        localStorage.setItem("validCodes", JSON.stringify(validCodes));

        msg.innerText = "Account created successfully!";
        msg.className = "success";

        // Clear fields
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
        document.getElementById("code").value = "";
    }
</script>

</body>
</html>
