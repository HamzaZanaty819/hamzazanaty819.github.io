<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body { background:black; color:purple; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.login-box { background:#2c2c2c; padding:40px; border-radius:10px; text-align:center; width:320px; box-shadow:2px 2px 15px rgba(0,0,0,0.5);}
.login-box input { width:90%; padding:10px; margin:10px 0; border:none; border-radius:5px; outline:none; }
.login-box button { background-color:purple; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; }
.error { color:red; margin-top:10px; }
.signup-link { color:lightblue; text-decoration:underline; cursor:pointer; display:block; margin-top:15px; }
</style>
</head>
<body>

<div class="login-box">
<h2>Login</h2>
<input type="text" id="username" placeholder="Email"><br>
<input type="password" id="password" placeholder="Password"><br>
<button onclick="loginUser()">Login</button>
<div id="loginMessage" class="error"></div>
<a href="signup.html" class="signup-link">Don't have an account? Sign Up</a>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx5TQWKQFmdO1eSy0wR6QP46f-7wALpxkYxIDHFvJ2B0hSLU1hVKMYmytkEohQe8JIS/exec";

async function loginUser() {
    const email = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("loginMessage");

    if(!email || !password){ msg.innerText="Enter email and password!"; return; }

    try {
        const response = await fetch(WEB_APP_URL, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ action:"login", email, password })
        });
        const result = await response.text();
        if(result==="Success"){
            localStorage.setItem("loggedIn","true");
            localStorage.setItem("userEmail",email);
            window.location.href="video.html";
        } else {
            msg.innerText=result;
            msg.className="error";
        }
    } catch(err){
        msg.innerText="Error connecting to server.";
        console.error(err);
    }
}
</script>
</body>
</html>
